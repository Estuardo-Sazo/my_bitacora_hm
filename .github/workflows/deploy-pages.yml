name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment halfway; a newer one simply waits its turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Probar y compilar
    runs-on: ubuntu-latest
    # The Supabase variables live in this GitHub environment.
    environment: Bitacora
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_AUTH_GOOGLE: ${{ vars.VITE_AUTH_GOOGLE }}
    steps:
      # Without these values the build would silently publish a demo with no sign-in.
      - name: Comprobar variables
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Faltan variables. Agrega VITE_SUPABASE_URL y VITE_SUPABASE_PUBLISHABLE_KEY al entorno Bitacora en Settings > Environments."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
